{{- if not .Values.openbao.enabled }}
{{- $password := required "postgres.password is required when openbao.enabled=false" .Values.postgres.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres.fullname" . }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  TINODE_DB: {{ .Values.postgres.tinodeDatabase | quote }}
  POSTGRES_URL: {{ printf "postgresql://%s:%s@%s:%d/%s" (urlquery .Values.postgres.user) (urlquery $password) (include "postgres.fullname" .) (.Values.service.port | int) (urlquery .Values.postgres.database) | quote }}
  TINODE_POSTGRES_URL: {{ printf "postgresql://%s:%s@%s:%d/%s" (urlquery .Values.postgres.user) (urlquery $password) (include "postgres.fullname" .) (.Values.service.port | int) (urlquery .Values.postgres.tinodeDatabase) | quote }}
{{- end }}
