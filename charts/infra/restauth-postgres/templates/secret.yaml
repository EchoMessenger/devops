{{- if not .Values.openbao.enabled }}
{{/*
  Keep password stable across helm upgrades.
*/}}
{{- $secretName := printf "%s-credentials" (include "restauthPostgres.fullname" .) -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}

{{- $password := "" -}}
{{- if $existingSecret }}
  {{- $password = index $existingSecret.data "POSTGRES_PASSWORD" | b64dec }}
{{- else }}
  {{- $password = randAlphaNum 32 }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "restauthPostgres.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_URL: {{ printf "postgresql://%s:%s@%s:%d/%s" (urlquery .Values.postgres.user) (urlquery $password) (include "restauthPostgres.fullname" .) (.Values.service.port | int) (urlquery .Values.postgres.database) | quote }}
  RESTAUTH_POSTGRES_URL: {{ printf "postgresql://%s:%s@%s:%d/%s" (urlquery .Values.postgres.user) (urlquery $password) (include "restauthPostgres.fullname" .) (.Values.service.port | int) (urlquery .Values.postgres.database) | quote }}
{{- end }}
