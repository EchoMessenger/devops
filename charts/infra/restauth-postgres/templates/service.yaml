apiVersion: v1
kind: Service
metadata:
  name: {{ include "restauthPostgres.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "restauthPostgres.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "restauthPostgres.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 5432
      name: postgres
