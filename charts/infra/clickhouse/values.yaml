# Основные настройки образа
image:
  repository: clickhouse/clickhouse-server
  tag: "24.3"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

# Настройки ClickHouse
clickhouse:
  # База данных для аудита
  defaultDatabase: "audit"
  
  # Админ пользователь
  defaultUser: "admin"
  defaultPassword: ""  # Генерируется автоматически
  
  # Дополнительные пользователи
  users:
    - name: ingestor
      password: ""  # Генерируется автоматически
      profile: ingestor
      quota: default
      databases:
        - audit
    - name: audit
      password: ""  # Генерируется автоматически
      profile: audit
      quota: default
      databases:
        - audit
  
  # Профили пользователей
  profiles:
    default:
      max_memory_usage: 10000000000
      use_uncompressed_cache: 0
      load_balancing: random
    
    readonly:
      readonly: 1
      max_memory_usage: 5000000000
      max_execution_time: 60

    audit:
      readonly: 0
      max_memory_usage: 5000000000
      max_execution_time: 60
    
    ingestor:
      readonly: 0
      max_memory_usage: 2000000000
      max_execution_time: 30
      max_insert_block_size: 1048576
  
  # Квоты
  quotas:
    default:
      interval:
        duration: 3600
        queries: 0
        errors: 0
        result_rows: 0
        read_rows: 0
        execution_time: 0

  # Настройки сервера
  config:
    logger:
      level: information
      log: /var/log/clickhouse-server/clickhouse-server.log
      errorlog: /var/log/clickhouse-server/clickhouse-server.err.log
      size: 1000M
      count: 10
    
    http_port: 8123
    tcp_port: 9000
    mysql_port: 9004
    postgresql_port: 9005
    interserver_http_port: 9009
    
    max_connections: 4096
    keep_alive_timeout: 3
    max_concurrent_queries: 100
    
    uncompressed_cache_size: 8589934592
    mark_cache_size: 5368709120
    
    path: /var/lib/clickhouse/
    tmp_path: /var/lib/clickhouse/tmp/
    user_files_path: /var/lib/clickhouse/user_files/
    format_schema_path: /var/lib/clickhouse/format_schemas/

  zookeeper:
    enabled: false

  cluster:
    enabled: false

  mergeTree:
    replicated_deduplication_window: 100
    replicated_deduplication_window_seconds: 604800
    max_suspicious_broken_parts: 10
    max_parts_in_total: 100000

  # Инициализационные SQL скрипты
  initScripts:
    enabled: true

# Ресурсы
resources:
  limits:
    cpu: 4
    memory: 8Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Persistent Volume
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 64Gi
  annotations: {}
  logs:
    enabled: false
    size: 10Gi
    storageClass: ""

# Service
service:
  type: ClusterIP
  annotations: {}
  httpPort: 8123
  tcpPort: 9000
  mysqlPort: 9004
  postgresqlPort: 9005
  interserverPort: 9009

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

podSecurityContext:
  fsGroup: 101

securityContext:
  runAsUser: 101
  runAsGroup: 101

livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

# ========================================
# PushSecret настройки
# ========================================
pushSecret:
  enabled: true
  secretStoreName: "openbao-global"
  refreshInterval: "1h"
  deletionPolicy: "Delete"
  useProperty: true
  
  # Пути для каждого пользователя
  paths:
    admin: "clickhouse/admin"
    ingestor: "clickhouse/ingestor"
    audit: "clickhouse/audit"

externalSecret:
  enabled: false