{{- if .Values.pushSecret.enabled }}
{{- $adminPassword := .Values.clickhouse.defaultPassword | default (randAlphaNum 24) -}}
{{- $ingestorUser := (index .Values.clickhouse.users 0) -}}
{{- $ingestorPassword := $ingestorUser.password | default (randAlphaNum 24) -}}
{{- $auditUser := (index .Values.clickhouse.users 1) -}}
{{- $auditPassword := $auditUser.password | default (randAlphaNum 24) -}}
---
# Сгенерированный Secret для admin (источник для PushSecret)
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clickhouse.fullname" . }}-admin-generated
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
type: Opaque
stringData:
  username: {{ .Values.clickhouse.defaultUser | quote }}
  password: {{ $adminPassword | quote }}
  httpUrl: {{ include "clickhouse.httpUrl" . | quote }}
  nativeUrl: {{ include "clickhouse.nativeUrl" (dict "root" . "username" .Values.clickhouse.defaultUser "password" $adminPassword) | quote }}
  jdbcUrl: {{ include "clickhouse.jdbcUrl" . | quote }}

---
# Сгенерированный Secret для ingestor
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clickhouse.fullname" . }}-ingestor-generated
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
type: Opaque
stringData:
  username: "ingestor"
  password: {{ $ingestorPassword | quote }}
  httpUrl: {{ include "clickhouse.httpUrl" . | quote }}
  nativeUrl: {{ include "clickhouse.nativeUrl" (dict "root" . "username" "ingestor" "password" $ingestorPassword) | quote }}
  jdbcUrl: {{ include "clickhouse.jdbcUrl" . | quote }}

---
# Сгенерированный Secret для audit
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clickhouse.fullname" . }}-audit-generated
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
type: Opaque
stringData:
  username: "audit"
  password: {{ $auditPassword | quote }}
  httpUrl: {{ include "clickhouse.httpUrl" . | quote }}
  nativeUrl: {{ include "clickhouse.nativeUrl" (dict "root" . "username" "audit" "password" $auditPassword) | quote }}
  jdbcUrl: {{ include "clickhouse.jdbcUrl" . | quote }}
{{- end }}
