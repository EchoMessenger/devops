{{- if .Values.pushSecret.enabled }}
{{- $fullname := include "clickhouse.fullname" . -}}
{{- $adminPassword := include "clickhouse.secretValue" (dict "root" . "secretName" (printf "%s-admin-generated" $fullname) "secretKey" "password" "value" .Values.clickhouse.defaultPassword "length" 24) -}}
{{- $ingestorUser := (index .Values.clickhouse.users 0) -}}
{{- $ingestorPassword := include "clickhouse.secretValue" (dict "root" . "secretName" (printf "%s-ingestor-generated" $fullname) "secretKey" "password" "value" $ingestorUser.password "length" 24) -}}
{{- $auditUser := (index .Values.clickhouse.users 1) -}}
{{- $auditPassword := include "clickhouse.secretValue" (dict "root" . "secretName" (printf "%s-audit-generated" $fullname) "secretKey" "password" "value" $auditUser.password "length" 24) -}}
---
# Сгенерированный Secret для admin (источник для PushSecret)
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-admin-generated
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
type: Opaque
stringData:
  username: {{ .Values.clickhouse.defaultUser | quote }}
  password: {{ $adminPassword | quote }}
  httpUrl: {{ include "clickhouse.httpUrl" . | quote }}
  nativeUrl: {{ include "clickhouse.nativeUrl" (dict "root" . "username" .Values.clickhouse.defaultUser "password" $adminPassword) | quote }}
  jdbcUrl: {{ include "clickhouse.jdbcUrl" . | quote }}

---
# Сгенерированный Secret для ingestor
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-ingestor-generated
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
type: Opaque
stringData:
  username: "ingestor"
  password: {{ $ingestorPassword | quote }}
  httpUrl: {{ include "clickhouse.httpUrl" . | quote }}
  nativeUrl: {{ include "clickhouse.nativeUrl" (dict "root" . "username" "ingestor" "password" $ingestorPassword) | quote }}
  jdbcUrl: {{ include "clickhouse.jdbcUrl" . | quote }}

---
# Сгенерированный Secret для audit
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-audit-generated
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
type: Opaque
stringData:
  username: "audit"
  password: {{ $auditPassword | quote }}
  httpUrl: {{ include "clickhouse.httpUrl" . | quote }}
  nativeUrl: {{ include "clickhouse.nativeUrl" (dict "root" . "username" "audit" "password" $auditPassword) | quote }}
  jdbcUrl: {{ include "clickhouse.jdbcUrl" . | quote }}
{{- end }}
