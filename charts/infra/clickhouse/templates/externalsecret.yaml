{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "clickhouse.fullname" . }}-externalsecret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName }}
    kind: ClusterSecretStore
  
  target:
    name: {{ include "clickhouse.fullname" . }}-external-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  
  data:
    - secretKey: CLICKHOUSE_USER
      remoteRef:
        key: {{ .Values.externalSecret.remotePath }}
        property: username
    
    - secretKey: CLICKHOUSE_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.remotePath }}
        property: password
    
    - secretKey: CLICKHOUSE_DB
      remoteRef:
        key: {{ .Values.externalSecret.remotePath }}
        property: database
    
    - secretKey: CLICKHOUSE_HTTP_URL
      remoteRef:
        key: {{ .Values.externalSecret.remotePath }}
        property: httpUrl
    
    - secretKey: CLICKHOUSE_NATIVE_URL
      remoteRef:
        key: {{ .Values.externalSecret.remotePath }}
        property: nativeUrl
    
    {{- range $index, $user := .Values.clickhouse.users }}
    - secretKey: CLICKHOUSE_USER_{{ $user.name | upper }}_PASSWORD
      remoteRef:
        key: {{ $.Values.externalSecret.remotePath }}
        property: user_{{ $user.name }}_password
    {{- end }}
{{- end }}