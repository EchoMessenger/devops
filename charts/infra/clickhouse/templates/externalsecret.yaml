{{- if .Values.externalSecret.enabled }}
{{- $fullname := include "clickhouse.fullname" . -}}
{{- range $secretName, $remotePath := .Values.externalSecret.paths }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-{{ $secretName }}-externalsecret
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "clickhouse.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $.Values.externalSecret.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ $fullname }}-credentials-{{ $secretName }}
    creationPolicy: Owner
    deletionPolicy: {{ $.Values.externalSecret.deletionPolicy | default "Retain" }}
  data:
    - secretKey: CLICKHOUSE_USER
      remoteRef:
        key: {{ $remotePath }}
        property: username
    - secretKey: CLICKHOUSE_PASSWORD
      remoteRef:
        key: {{ $remotePath }}
        property: password
    - secretKey: CLICKHOUSE_HTTP_URL
      remoteRef:
        key: {{ $remotePath }}
        property: httpUrl
    - secretKey: CLICKHOUSE_NATIVE_URL
      remoteRef:
        key: {{ $remotePath }}
        property: nativeUrl
    - secretKey: CLICKHOUSE_JDBC_URL
      remoteRef:
        key: {{ $remotePath }}
        property: jdbcUrl
{{- end }}
{{- end }}
