{{- if and .Values.pushSecret.enabled (not .Values.externalSecret.enabled) }}
---
# PushSecret для admin credentials
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ include "clickhouse.fullname" . }}-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.pushSecret.refreshInterval }}
  deletionPolicy: {{ .Values.pushSecret.deletionPolicy }}
  
  secretStoreRefs:
    - name: {{ .Values.pushSecret.secretStoreName }}
      kind: ClusterSecretStore
  
  selector:
    secret:
      name: {{ include "clickhouse.fullname" . }}-credentials-admin
  
  data:
    - match:
        secretKey: CLICKHOUSE_USER
        remoteRef:
          remoteKey: {{ .Values.pushSecret.paths.admin }}
          property: username
    - match:
        secretKey: CLICKHOUSE_PASSWORD
        remoteRef:
          remoteKey: {{ .Values.pushSecret.paths.admin }}
          property: password
    - match:
        secretKey: CLICKHOUSE_HTTP_URL
        remoteRef:
          remoteKey: {{ .Values.pushSecret.paths.admin }}
          property: httpUrl
    - match:
        secretKey: CLICKHOUSE_NATIVE_URL
        remoteRef:
          remoteKey: {{ .Values.pushSecret.paths.admin }}
          property: nativeUrl
    - match:
        secretKey: CLICKHOUSE_JDBC_URL
        remoteRef:
          remoteKey: {{ .Values.pushSecret.paths.admin }}
          property: jdbcUrl

