{{- if .Values.pushSecret.enabled }}
# PushSecret для admin
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ include "clickhouse.fullname" . }}-pushsecret-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.pushSecret.refreshInterval | default "1h" }}
  
  secretStoreRefs:
    - name: {{ .Values.pushSecret.secretStoreName }}
      kind: ClusterSecretStore
  
  selector:
    secret:
      name: {{ include "clickhouse.fullname" . }}-credentials-admin
  
  data:
    - match:
        secretKey: CLICKHOUSE_USER
        remoteRef:
          remoteKey: {{ .Values.pushSecret.paths.admin }}
          {{- if .Values.pushSecret.useProperty }}
          property: username
          {{- end }}
    - match:
        secretKey: CLICKHOUSE_PASSWORD
        remoteRef:
          remoteKey: {{ .Values.pushSecret.paths.admin }}
          {{- if .Values.pushSecret.useProperty }}
          property: password
          {{- end }}
    - match:
        secretKey: CLICKHOUSE_DB
        remoteRef:
          remoteKey: {{ .Values.pushSecret.paths.admin }}
          {{- if .Values.pushSecret.useProperty }}
          property: database
          {{- end }}
    - match:
        secretKey: CLICKHOUSE_HOST
        remoteRef:
          remoteKey: {{ .Values.pushSecret.paths.admin }}
          {{- if .Values.pushSecret.useProperty }}
          property: host
          {{- end }}
    - match:
        secretKey: CLICKHOUSE_HTTP_PORT
        remoteRef:
          remoteKey: {{ .Values.pushSecret.paths.admin }}
          {{- if .Values.pushSecret.useProperty }}
          property: httpPort
          {{- end }}
    - match:
        secretKey: CLICKHOUSE_TCP_PORT
        remoteRef:
          remoteKey: {{ .Values.pushSecret.paths.admin }}
          {{- if .Values.pushSecret.useProperty }}
          property: tcpPort
          {{- end }}
    - match:
        secretKey: CLICKHOUSE_HTTP_URL
        remoteRef:
          remoteKey: {{ .Values.pushSecret.paths.admin }}
          {{- if .Values.pushSecret.useProperty }}
          property: httpUrl
          {{- end }}
    - match:
        secretKey: CLICKHOUSE_NATIVE_URL
        remoteRef:
          remoteKey: {{ .Values.pushSecret.paths.admin }}
          {{- if .Values.pushSecret.useProperty }}
          property: nativeUrl
          {{- end }}
  
  deletionPolicy: {{ .Values.pushSecret.deletionPolicy | default "None" }}
---
{{- range .Values.clickhouse.users }}
# PushSecret для {{ .name }}
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ include "clickhouse.fullname" $ }}-pushsecret-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "clickhouse.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.pushSecret.refreshInterval | default "1h" }}
  
  secretStoreRefs:
    - name: {{ $.Values.pushSecret.secretStoreName }}
      kind: ClusterSecretStore
  
  selector:
    secret:
      name: {{ include "clickhouse.fullname" $ }}-credentials-{{ .name }}
  
  data:
    - match:
        secretKey: CLICKHOUSE_USER
        remoteRef:
          remoteKey: {{ index $.Values.pushSecret.paths .name }}
          {{- if $.Values.pushSecret.useProperty }}
          property: username
          {{- end }}
    - match:
        secretKey: CLICKHOUSE_PASSWORD
        remoteRef:
          remoteKey: {{ index $.Values.pushSecret.paths .name }}
          {{- if $.Values.pushSecret.useProperty }}
          property: password
          {{- end }}
    - match:
        secretKey: CLICKHOUSE_DB
        remoteRef:
          remoteKey: {{ index $.Values.pushSecret.paths .name }}
          {{- if $.Values.pushSecret.useProperty }}
          property: database
          {{- end }}
    - match:
        secretKey: CLICKHOUSE_HOST
        remoteRef:
          remoteKey: {{ index $.Values.pushSecret.paths .name }}
          {{- if $.Values.pushSecret.useProperty }}
          property: host
          {{- end }}
    - match:
        secretKey: CLICKHOUSE_HTTP_PORT
        remoteRef:
          remoteKey: {{ index $.Values.pushSecret.paths .name }}
          {{- if $.Values.pushSecret.useProperty }}
          property: httpPort
          {{- end }}
    - match:
        secretKey: CLICKHOUSE_TCP_PORT
        remoteRef:
          remoteKey: {{ index $.Values.pushSecret.paths .name }}
          {{- if $.Values.pushSecret.useProperty }}
          property: tcpPort
          {{- end }}
    - match:
        secretKey: CLICKHOUSE_HTTP_URL
        remoteRef:
          remoteKey: {{ index $.Values.pushSecret.paths .name }}
          {{- if $.Values.pushSecret.useProperty }}
          property: httpUrl
          {{- end }}
    - match:
        secretKey: CLICKHOUSE_NATIVE_URL
        remoteRef:
          remoteKey: {{ index $.Values.pushSecret.paths .name }}
          {{- if $.Values.pushSecret.useProperty }}
          property: nativeUrl
          {{- end }}
  
  deletionPolicy: {{ $.Values.pushSecret.deletionPolicy | default "None" }}
---
{{- end }}
{{- end }}