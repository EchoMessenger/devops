{{- if .Values.pushSecret.enabled }}
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ include "clickhouse.fullname" . }}-pushsecret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.pushSecret.refreshInterval | default "1h" }}
  
  secretStoreRefs:
    - name: {{ .Values.pushSecret.secretStoreName }}
      kind: ClusterSecretStore
  
  selector:
    secret:
      name: {{ include "clickhouse.fullname" . }}-credentials
  
  data:
    # Основной пользователь
    - match:
        secretKey: CLICKHOUSE_USER
        remoteRef:
          remoteKey: {{ .Values.pushSecret.remotePath }}
          {{- if .Values.pushSecret.useProperty }}
          property: username
          {{- end }}
    
    - match:
        secretKey: CLICKHOUSE_PASSWORD
        remoteRef:
          remoteKey: {{ .Values.pushSecret.remotePath }}
          {{- if .Values.pushSecret.useProperty }}
          property: password
          {{- end }}
    
    - match:
        secretKey: CLICKHOUSE_DB
        remoteRef:
          remoteKey: {{ .Values.pushSecret.remotePath }}
          {{- if .Values.pushSecret.useProperty }}
          property: database
          {{- end }}
    
    # HTTP URL
    - match:
        secretKey: CLICKHOUSE_HTTP_URL
        remoteRef:
          remoteKey: {{ .Values.pushSecret.remotePath }}
          {{- if .Values.pushSecret.useProperty }}
          property: httpUrl
          {{- end }}
    
    # Native URL
    - match:
        secretKey: CLICKHOUSE_NATIVE_URL
        remoteRef:
          remoteKey: {{ .Values.pushSecret.remotePath }}
          {{- if .Values.pushSecret.useProperty }}
          property: nativeUrl
          {{- end }}
    
    {{- /* Пароли дополнительных пользователей */}}
    {{- range $index, $user := .Values.clickhouse.users }}
    - match:
        secretKey: CLICKHOUSE_USER_{{ $user.name | upper }}_PASSWORD
        remoteRef:
          remoteKey: {{ $.Values.pushSecret.remotePath }}
          {{- if $.Values.pushSecret.useProperty }}
          property: user_{{ $user.name }}_password
          {{- end }}
    {{- end }}
    
    {{- /* Дополнительные секреты */}}
    {{- range .Values.pushSecret.additionalSecrets }}
    - match:
        secretKey: {{ .secretKey }}
        remoteRef:
          remoteKey: {{ $.Values.pushSecret.remotePath }}
          {{- if $.Values.pushSecret.useProperty }}
          property: {{ .property }}
          {{- end }}
    {{- end }}
  
  deletionPolicy: {{ .Values.pushSecret.deletionPolicy | default "None" }}
{{- end }}