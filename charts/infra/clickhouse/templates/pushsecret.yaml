{{- if .Values.pushSecret.enabled }}
---
# PushSecret для admin credentials
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ include "clickhouse.fullname" . }}-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.pushSecret.refreshInterval }}
  deletionPolicy: {{ .Values.pushSecret.deletionPolicy }}
  
  secretStoreRefs:
    - name: {{ .Values.pushSecret.secretStoreName }}
      kind: ClusterSecretStore
  
  selector:
    secret:
      name: {{ include "clickhouse.fullname" . }}-admin-generated
  
  {{- if .Values.pushSecret.useProperty }}
  data:
    - match:
        secretKey: username
      remoteRef:
        remoteKey: {{ .Values.pushSecret.paths.admin }}
        property: username
    - match:
        secretKey: password
      remoteRef:
        remoteKey: {{ .Values.pushSecret.paths.admin }}
        property: password
    - match:
        secretKey: httpUrl
      remoteRef:
        remoteKey: {{ .Values.pushSecret.paths.admin }}
        property: httpUrl
    - match:
        secretKey: jdbcUrl
      remoteRef:
        remoteKey: {{ .Values.pushSecret.paths.admin }}
        property: jdbcUrl
  {{- end }}

