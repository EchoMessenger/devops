apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.service.name | default (include "openbao.fullname" .) }}-seed-db-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "openbao.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "50"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "openbao.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: openbao-bootstrap
      containers:
        - name: seed-db-secrets
          image: bitnami/kubectl:latest
          command: ["/bin/sh", "-c"]
          env:
            - name: BAO_ADDR
              value: {{ quote .Values.openbao.server }}
            - name: BAO_SECRET_PATH
              value: {{ quote .Values.openbao.path }}
          args:
            - |
              set -e

              rand_password() {
                tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32
                echo
              }

              uri_escape() {
                jq -rn --arg v "$1" '$v|@uri'
              }

              wait_for_openbao() {
                echo "Waiting for OpenBao API..."
                until curl -s "$BAO_ADDR/v1/sys/health" >/dev/null 2>&1; do
                  sleep 2
                done

                echo "Waiting for OpenBao to be unsealed..."
                until [ "$(curl -s "$BAO_ADDR/v1/sys/seal-status" | jq -r .sealed)" = "false" ]; do
                  sleep 5
                done
              }

              get_root_token() {
                kubectl get secret openbao-bootstrap -n {{ .Release.Namespace }} \
                  -o jsonpath='{.data.root-token}' | base64 -d
              }

              secret_exists() {
                local path="$1"
                local status
                status=$(curl -s -o /tmp/openbao-secret-check.json -w "%{http_code}" \
                  -H "X-Vault-Token: $ROOT_TOKEN" \
                  "$BAO_ADDR/v1/$BAO_SECRET_PATH/data/$path")

                if [ "$status" = "200" ]; then
                  return 0
                fi

                if [ "$status" = "404" ]; then
                  return 1
                fi

                echo "Unexpected response while checking $path (HTTP $status)"
                cat /tmp/openbao-secret-check.json
                exit 1
              }

              write_secret() {
                local path="$1"
                local payload="$2"
                local status

                status=$(curl -s -o /tmp/openbao-secret-write.json -w "%{http_code}" \
                  -X POST \
                  -H "X-Vault-Token: $ROOT_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "$payload" \
                  "$BAO_ADDR/v1/$BAO_SECRET_PATH/data/$path")

                if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
                  echo "Failed to write secret at $path (HTTP $status)"
                  cat /tmp/openbao-secret-write.json
                  exit 1
                fi

                if jq -e '.errors' /tmp/openbao-secret-write.json >/dev/null 2>&1; then
                  echo "Failed to write secret at $path"
                  cat /tmp/openbao-secret-write.json
                  exit 1
                fi
              }

              ensure_secret() {
                local path="$1"
                local payload="$2"

                if secret_exists "$path"; then
                  echo "Secret already exists at $path, skipping"
                  return 0
                fi

                echo "Creating secret at $path"
                write_secret "$path" "$payload"
              }

              build_postgres_payload() {
                local username="$1"
                local password="$2"
                local database="$3"
                local url="$4"
                local dsn="$5"

                jq -n \
                  --arg username "$username" \
                  --arg password "$password" \
                  --arg database "$database" \
                  --arg url "$url" \
                  --arg dsn "$dsn" \
                  '{
                    data: {
                      username: $username,
                      password: $password,
                      database: $database,
                      url: $url,
                      dsn: $dsn
                    }
                  }'
              }

              build_clickhouse_payload() {
                local username="$1"
                local password="$2"
                local http_url="$3"
                local native_url="$4"
                local jdbc_url="$5"

                jq -n \
                  --arg username "$username" \
                  --arg password "$password" \
                  --arg httpUrl "$http_url" \
                  --arg nativeUrl "$native_url" \
                  --arg jdbcUrl "$jdbc_url" \
                  '{
                    data: {
                      username: $username,
                      password: $password,
                      httpUrl: $httpUrl,
                      nativeUrl: $nativeUrl,
                      jdbcUrl: $jdbcUrl
                    }
                  }'
              }

              wait_for_openbao
              ROOT_TOKEN=$(get_root_token)

              if [ -z "$ROOT_TOKEN" ] || [ "$ROOT_TOKEN" = "null" ]; then
                echo "ERROR: root token not available"
                exit 1
              fi

              POSTGRES_USER="postgres"
              POSTGRES_PASSWORD=$(rand_password)
              POSTGRES_USER_ENC=$(uri_escape "$POSTGRES_USER")
              POSTGRES_PASSWORD_ENC=$(uri_escape "$POSTGRES_PASSWORD")
              POSTGRES_URL="postgresql://${POSTGRES_USER_ENC}:${POSTGRES_PASSWORD_ENC}@postgres.tinode.svc.cluster.local:5432/postgres"
              TINODE_POSTGRES_URL="postgresql://${POSTGRES_USER_ENC}:${POSTGRES_PASSWORD_ENC}@postgres.tinode.svc.cluster.local:5432/tinode"
              ensure_secret "tinode/postgres" "$(build_postgres_payload "$POSTGRES_USER" "$POSTGRES_PASSWORD" "postgres" "$POSTGRES_URL" "$TINODE_POSTGRES_URL")"

              RESTAUTH_USER="restauth"
              RESTAUTH_PASSWORD=$(rand_password)
              RESTAUTH_USER_ENC=$(uri_escape "$RESTAUTH_USER")
              RESTAUTH_PASSWORD_ENC=$(uri_escape "$RESTAUTH_PASSWORD")
              RESTAUTH_URL="postgresql://${RESTAUTH_USER_ENC}:${RESTAUTH_PASSWORD_ENC}@restauth-postgres.restauth.svc.cluster.local:5432/restauth"
              ensure_secret "restauth/database" "$(build_postgres_payload "$RESTAUTH_USER" "$RESTAUTH_PASSWORD" "restauth" "$RESTAUTH_URL" "$RESTAUTH_URL")"

              TASKTRACKER_USER="postgres"
              TASKTRACKER_PASSWORD=$(rand_password)
              TASKTRACKER_USER_ENC=$(uri_escape "$TASKTRACKER_USER")
              TASKTRACKER_PASSWORD_ENC=$(uri_escape "$TASKTRACKER_PASSWORD")
              TASKTRACKER_URL="postgresql://${TASKTRACKER_USER_ENC}:${TASKTRACKER_PASSWORD_ENC}@tasktracker-postgres.tasktracker.svc.cluster.local:5432/tasktracker"
              ensure_secret "tasktracker/postgres" "$(build_postgres_payload "$TASKTRACKER_USER" "$TASKTRACKER_PASSWORD" "tasktracker" "$TASKTRACKER_URL" "$TASKTRACKER_URL")"

              CLICKHOUSE_HOST="clickhouse.clickhouse.svc.cluster.local"
              CLICKHOUSE_HTTP_PORT="8123"
              CLICKHOUSE_TCP_PORT="9000"
              CLICKHOUSE_DB="audit"

              CLICKHOUSE_ADMIN_PASSWORD=$(rand_password)
              CLICKHOUSE_ADMIN_HTTP_URL="http://${CLICKHOUSE_HOST}:${CLICKHOUSE_HTTP_PORT}"
              CLICKHOUSE_ADMIN_NATIVE_URL="clickhouse://admin:${CLICKHOUSE_ADMIN_PASSWORD}@${CLICKHOUSE_HOST}:${CLICKHOUSE_TCP_PORT}/${CLICKHOUSE_DB}"
              CLICKHOUSE_ADMIN_JDBC_URL="jdbc:clickhouse://${CLICKHOUSE_HOST}:${CLICKHOUSE_HTTP_PORT}/${CLICKHOUSE_DB}"
              ensure_secret "clickhouse/admin" "$(build_clickhouse_payload "admin" "$CLICKHOUSE_ADMIN_PASSWORD" "$CLICKHOUSE_ADMIN_HTTP_URL" "$CLICKHOUSE_ADMIN_NATIVE_URL" "$CLICKHOUSE_ADMIN_JDBC_URL")"

              CLICKHOUSE_INGESTOR_PASSWORD=$(rand_password)
              CLICKHOUSE_INGESTOR_HTTP_URL="http://${CLICKHOUSE_HOST}:${CLICKHOUSE_HTTP_PORT}"
              CLICKHOUSE_INGESTOR_NATIVE_URL="clickhouse://ingestor:${CLICKHOUSE_INGESTOR_PASSWORD}@${CLICKHOUSE_HOST}:${CLICKHOUSE_TCP_PORT}/${CLICKHOUSE_DB}"
              CLICKHOUSE_INGESTOR_JDBC_URL="jdbc:clickhouse://${CLICKHOUSE_HOST}:${CLICKHOUSE_HTTP_PORT}/${CLICKHOUSE_DB}"
              ensure_secret "clickhouse/ingestor" "$(build_clickhouse_payload "ingestor" "$CLICKHOUSE_INGESTOR_PASSWORD" "$CLICKHOUSE_INGESTOR_HTTP_URL" "$CLICKHOUSE_INGESTOR_NATIVE_URL" "$CLICKHOUSE_INGESTOR_JDBC_URL")"

              CLICKHOUSE_AUDIT_PASSWORD=$(rand_password)
              CLICKHOUSE_AUDIT_HTTP_URL="http://${CLICKHOUSE_HOST}:${CLICKHOUSE_HTTP_PORT}"
              CLICKHOUSE_AUDIT_NATIVE_URL="clickhouse://audit:${CLICKHOUSE_AUDIT_PASSWORD}@${CLICKHOUSE_HOST}:${CLICKHOUSE_TCP_PORT}/${CLICKHOUSE_DB}"
              CLICKHOUSE_AUDIT_JDBC_URL="jdbc:clickhouse://${CLICKHOUSE_HOST}:${CLICKHOUSE_HTTP_PORT}/${CLICKHOUSE_DB}"
              ensure_secret "clickhouse/audit" "$(build_clickhouse_payload "audit" "$CLICKHOUSE_AUDIT_PASSWORD" "$CLICKHOUSE_AUDIT_HTTP_URL" "$CLICKHOUSE_AUDIT_NATIVE_URL" "$CLICKHOUSE_AUDIT_JDBC_URL")"

              echo "DB secret seeding complete"
