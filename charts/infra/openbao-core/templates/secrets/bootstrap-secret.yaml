{{- $existing := lookup "v1" "Secret" .Release.Namespace "openbao-bootstrap" }}
{{- if not $existing }}
apiVersion: v1
kind: Secret
metadata:
  name: openbao-bootstrap
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  root-token: ""
  unseal-key-1: ""
  unseal-key-2: ""
  unseal-key-3: ""
{{- end }}