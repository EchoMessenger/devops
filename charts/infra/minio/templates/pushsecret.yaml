{{- if .Values.pushSecret.enabled }}
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ include "minio.fullname" . }}-pushsecret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.pushSecret.refreshInterval | default "1h" }}

  secretStoreRefs:
    - name: {{ .Values.pushSecret.secretStoreName }}
      kind: ClusterSecretStore

  selector:
    secret:
      name: {{ include "minio.fullname" . }}-credentials

  data:
    - match:
        secretKey: access-key
        remoteRef:
          remoteKey: {{ .Values.pushSecret.remotePath }}
          {{- if .Values.pushSecret.useProperty }}
          property: accessKey
          {{- end }}
    - match:
        secretKey: secret-key
        remoteRef:
          remoteKey: {{ .Values.pushSecret.remotePath }}
          {{- if .Values.pushSecret.useProperty }}
          property: secretKey
          {{- end }}
    - match:
        secretKey: endpoint
        remoteRef:
          remoteKey: {{ .Values.pushSecret.remotePath }}
          {{- if .Values.pushSecret.useProperty }}
          property: endpoint
          {{- end }}
    - match:
        secretKey: region
        remoteRef:
          remoteKey: {{ .Values.pushSecret.remotePath }}
          {{- if .Values.pushSecret.useProperty }}
          property: region
          {{- end }}
    - match:
        secretKey: bucket
        remoteRef:
          remoteKey: {{ .Values.pushSecret.remotePath }}
          {{- if .Values.pushSecret.useProperty }}
          property: bucket
          {{- end }}

  deletionPolicy: {{ .Values.pushSecret.deletionPolicy | default "None" }}
{{- end }}
