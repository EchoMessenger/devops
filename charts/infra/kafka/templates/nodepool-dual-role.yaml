apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: {{ .Values.kafka.namespace }}
  labels:
    strimzi.io/cluster: {{ .Values.kafka.name }}
spec:
  replicas: {{ .Values.kafka.replicas }}
  roles:
    - controller
    - broker
  resources:
    requests:
      cpu: {{ .Values.kafka.resources.requests.cpu | default "500m" | quote }}
      memory: {{ .Values.kafka.resources.requests.memory | default "1Gi" | quote }}
    limits:
      cpu: {{ .Values.kafka.resources.limits.cpu | default "1000m" | quote }}
      memory: {{ .Values.kafka.resources.limits.memory | default "2Gi" | quote }}
  storage:
    type: jbod
    volumes:
      - id: 0
        type: {{ .Values.storage.type }}
        size: {{ .Values.storage.size }}
        deleteClaim: {{ .Values.storage.deleteClaim }}
        kraftMetadata: shared
