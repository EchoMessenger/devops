{{- if .Values.openbao.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "postgres.fullname" . }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.openbao.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.openbao.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "postgres.fullname" . }}-credentials
    creationPolicy: Owner
    deletionPolicy: {{ .Values.openbao.deletionPolicy | default "Retain" }}
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: {{ .Values.openbao.secretPath }}
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.openbao.secretPath }}
        property: password
    - secretKey: POSTGRES_DB
      remoteRef:
        key: {{ .Values.openbao.secretPath }}
        property: database
    - secretKey: POSTGRES_URL
      remoteRef:
        key: {{ .Values.openbao.secretPath }}
        property: url
{{- end }}
