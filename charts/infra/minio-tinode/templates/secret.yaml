{{- $secretName := printf "%s-credentials" (include "minio.fullname" .) -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := .Values.minio.rootPassword | default "" -}}
{{- if eq $password "" }}
  {{- if $existingSecret }}
    {{- $password = index $existingSecret.data "MINIO_ROOT_PASSWORD" | b64dec }}
  {{- else }}
    {{- $password = randAlphaNum 32 }}
  {{- end }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
type: Opaque
stringData:
  MINIO_ROOT_USER: {{ .Values.minio.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ $password | quote }}
  access-key: {{ .Values.minio.rootUser | quote }}
  secret-key: {{ $password | quote }}
  endpoint: {{ printf "http://%s.%s.svc.cluster.local:%v" (include "minio.fullname" .) .Release.Namespace .Values.service.apiPort | quote }}
  region: {{ .Values.minio.region | quote }}
  bucket: {{ .Values.minio.bucket.name | quote }}
