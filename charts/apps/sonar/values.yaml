postgres:
  enabled: true
  fullnameOverride: sonarqube-postgres
  existingSecret: sonarqube-postgres-secret
  username: sonar
  database: sonarqube
  password: ""
  dataDir: /var/lib/postgresql/data/pgdata
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  storage:
    size: 10Gi
    storageClassName: local-path
  resources:
    requests:
      cpu: "50m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

openbao:
  enabled: true
  secretStoreName: openbao-global
  secretPath: sonar/postgres
  monitoringSecretPath: sonar/monitoring
  refreshInterval: "1h"
  deletionPolicy: Retain

monitoring:
  existingSecret: sonarqube-monitoring-secret
  passcodeKey: MONITORING_PASSCODE
  passcode: ""

sonarqube:
  replicaCount: 1

  image:
    tag: "latest"

  jdbcOverwrite:
    enabled: true
    jdbcUrl: "jdbc:postgresql://sonarqube-postgres.sonar.svc.cluster.local:5432/sonarqube"
    jdbcUsername: "sonar"
    jdbcSecretName: "sonarqube-postgres-secret"
    jdbcSecretPasswordKey: "password"

  persistence:
    enabled: true
    size: 10Gi

  ingress:
    enabled: true
    hosts:
      - name: sonar.echo-messenger.ru
        path: /
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      traefik.ingress.kubernetes.io/router.middlewares: "sonar-redirect-https@kubernetescrd"
    tls:
      - hosts:
          - sonar.echo-messenger.ru
        secretName: sonar-tls

  resources:
    requests:
      cpu: "100m"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

  # Важно для Elasticsearch внутри SonarQube
  initSysctl:
    enabled: true   # попытается выставить vm.max_map_count, но в k3s лучше делать вручную

  jvmOpts: "-Xmx1024m -Xms512m"

  monitoringPasscodeSecretName: "sonarqube-monitoring-secret"
  monitoringPasscodeSecretKey: "MONITORING_PASSCODE"

  community:
    enabled: true
