{{- if and .Values.postgres.enabled (not .Values.openbao.enabled) }}
{{- $password := required "postgres.password is required when openbao.enabled=false" .Values.postgres.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sonar.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ $password | quote }}
  postgres-password: {{ $password | quote }}
  database: {{ .Values.postgres.database | quote }}
{{- end }}
