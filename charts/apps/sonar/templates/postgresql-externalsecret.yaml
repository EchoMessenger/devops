{{- if and .Values.postgres.enabled .Values.openbao.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgres.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sonar.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  refreshInterval: {{ .Values.openbao.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.openbao.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.postgres.existingSecret }}
    creationPolicy: Owner
    deletionPolicy: {{ .Values.openbao.deletionPolicy }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.openbao.secretPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.openbao.secretPath }}
        property: password
    - secretKey: postgres-password
      remoteRef:
        key: {{ .Values.openbao.secretPath }}
        property: password
    - secretKey: database
      remoteRef:
        key: {{ .Values.openbao.secretPath }}
        property: database
{{- end }}
