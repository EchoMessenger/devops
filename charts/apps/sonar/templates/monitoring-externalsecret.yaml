{{- if .Values.openbao.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.monitoring.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sonar.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.openbao.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.openbao.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.monitoring.existingSecret }}
    creationPolicy: Owner
    deletionPolicy: {{ .Values.openbao.deletionPolicy }}
  data:
    - secretKey: {{ .Values.monitoring.passcodeKey }}
      remoteRef:
        key: {{ .Values.openbao.monitoringSecretPath }}
        property: passcode
{{- end }}
