{{- if not .Values.openbao.enabled }}
{{- $passcode := required "monitoring.passcode is required when openbao.enabled=false" .Values.monitoring.passcode }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.monitoring.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sonar.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.monitoring.passcodeKey }}: {{ $passcode | quote }}
{{- end }}
