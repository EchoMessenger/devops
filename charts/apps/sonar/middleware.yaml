apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: sonar
spec:
  redirectScheme:
    scheme: https
    permanent: true

livenessProbe:
  exec:
    command:
      - sh
      - -c
      - |
        wget --no-proxy -qO- --timeout=1 \
          --header="X-Sonar-Passcode: $SONAR_WEB_SYSTEMPASSCODE" \
          http://localhost:9000/api/system/liveness
  initialDelaySeconds: 60
  periodSeconds: 30
  failureThreshold: 6
  timeoutSeconds: 2

readinessProbe:
  exec:
    command:
      - sh
      - -c
      - |
        wget --no-proxy -qO- http://localhost:9000/api/system/status | grep -q -e '"status":"UP"' -e '"status":"DB_MIGRATION_NEEDED"' -e '"status":"DB_MIGRATION_RUNNING"'
  initialDelaySeconds: 60
  periodSeconds: 30
  failureThreshold: 6
  timeoutSeconds: 2

startupProbe:
  httpGet:
    path: /api/system/status
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 24
  timeoutSeconds: 2