---
# ── Service ───────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: {{ include "audit-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "audit-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.healthPort }}
      targetPort: health
      protocol: TCP
      name: health
  selector:
    {{- include "audit-service.selectorLabels" . | nindent 4 }}

---
# ── ConfigMap ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "audit-service.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "audit-service.labels" . | nindent 4 }}
data:
  SERVER_PORT: {{ .Values.env.SERVER_PORT | quote }}
  HEALTH_PORT: {{ .Values.env.HEALTH_PORT | quote }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | quote }}
  EXPORT_STORAGE_TYPE: {{ .Values.env.EXPORT_STORAGE_TYPE | quote }}
  EXPORT_PVC_PATH: {{ .Values.env.EXPORT_PVC_PATH | quote }}
  CLICKHOUSE_POOL_SIZE: {{ .Values.env.CLICKHOUSE_POOL_SIZE | quote }}

---
# ── ServiceAccount ────────────────────────────────────────────────────────────
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "audit-service.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "audit-service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}

---
# ── HorizontalPodAutoscaler ───────────────────────────────────────────────────
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "audit-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "audit-service.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "audit-service.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}

---
# ── PersistentVolumeClaim (для export файлов) ─────────────────────────────────
{{- if .Values.exportStorage.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "audit-service.fullname" . }}-exports
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "audit-service.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.exportStorage.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.exportStorage.size }}
{{- end }}

---
# ── NetworkPolicy ─────────────────────────────────────────────────────────────
# Входящий трафик только от ingress и Prometheus scraper.
# Исходящий: ClickHouse (8123), Keycloak (8080/443).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "audit-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "audit-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "audit-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # HTTP от Traefik ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
    # Prometheus scraping метрик
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8081
  egress:
    # ClickHouse HTTP порт
    - ports:
        - protocol: TCP
          port: 8123
    # Keycloak для JWT validation
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 443
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# ── ExternalSecret (ClickHouse credentials из Vault) ─────────────────────────
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "audit-service.fullname" . }}-clickhouse
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "audit-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "audit-service.fullname" . }}-clickhouse
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: {{ .Values.externalSecrets.clickhouse.remoteRef.key }}
        property: nativeUrl
    - secretKey: user
      remoteRef:
        key: {{ .Values.externalSecrets.clickhouse.remoteRef.key }}
        property: user
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.clickhouse.remoteRef.key }}
        property: password

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "audit-service.fullname" . }}-keycloak
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "audit-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "audit-service.fullname" . }}-keycloak
    creationPolicy: Owner
  data:
    - secretKey: issuer-uri
      remoteRef:
        key: {{ .Values.externalSecrets.keycloak.remoteRef.key }}
        property: issuer-uri
{{- end }}

---
# ── Ingress ───────────────────────────────────────────────────────────────────
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "audit-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "audit-service.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "audit-service.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
