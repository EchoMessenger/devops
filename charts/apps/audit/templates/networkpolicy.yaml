apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "audit-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "audit-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "audit-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # HTTP от Traefik ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
    # Prometheus scraping метрик
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8081
  egress:
    # ClickHouse HTTP порт
    - ports:
        - protocol: TCP
          port: 8123
    # Keycloak для JWT validation
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 443
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53