{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "audit-service.fullname" . }}-clickhouse
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "audit-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "audit-service.fullname" . }}-clickhouse
    creationPolicy: Owner
  data:
    - secretKey: native-url
      remoteRef:
        key: {{ .Values.externalSecrets.clickhouse.remoteRef.key }}
        property: nativeUrl
    - secretKey: http-url
      remoteRef:
        key: {{ .Values.externalSecrets.clickhouse.remoteRef.key }}
        property: httpUrl
    - secretKey: username
      remoteRef:
        key: {{ .Values.externalSecrets.clickhouse.remoteRef.key }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.clickhouse.remoteRef.key }}
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "audit-service.fullname" . }}-keycloak
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "audit-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "audit-service.fullname" . }}-keycloak
    creationPolicy: Owner
  data:
    - secretKey: issuer-uri
      remoteRef:
        key: {{ .Values.externalSecrets.keycloak.remoteRef.key }}
        property: issuer-uri
---
# Секрет для пулла образа из ghcr
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "audit-service.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-global
    kind: ClusterSecretStore
  target:
    name: ghcr-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "username": "{{ "{{" }} .username {{ "}}" }}",
                "password": "{{ "{{" }} .token {{ "}}" }}",
                "auth": "{{ "{{" }} printf "%s:%s" .username .token | b64enc {{ "}}" }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: registry/ghcr
        property: username
    - secretKey: token
      remoteRef:
        key: registry/ghcr
        property: token
{{- end }}