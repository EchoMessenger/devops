apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "audit-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "audit-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "audit-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # Форсируем rollout при изменении ConfigMap или Secret
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "audit-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "audit-service.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      # tmpdir нужен для Spring Boot (temp files) при readOnlyRootFilesystem
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.exportStorage.enabled }}
        - name: exports
          persistentVolumeClaim:
            claimName: {{ include "audit-service.fullname" . }}-exports
        {{- end }}

      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- $s3SecretName := default (printf "%s-s3" (include "audit-service.fullname" .)) .Values.s3Credentials.existingSecret }}

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP

          env:
            # Некритичные параметры из ConfigMap
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "audit-service.fullname" . }}-config
                  key: SERVER_PORT
            - name: HEALTH_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "audit-service.fullname" . }}-config
                  key: HEALTH_PORT
            - name: RESTAUTH_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "audit-service.fullname" . }}-config
                  key: RESTAUTH_BASE_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "audit-service.fullname" . }}-config
                  key: LOG_LEVEL
            - name: EXPORT_STORAGE_TYPE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "audit-service.fullname" . }}-config
                  key: EXPORT_STORAGE_TYPE
            - name: EXPORT_PVC_PATH
              valueFrom:
                configMapKeyRef:
                  name: {{ include "audit-service.fullname" . }}-config
                  key: EXPORT_PVC_PATH
            {{- if and .Values.s3ConfigFromSecret.enabled (or .Values.s3Credentials.existingSecret .Values.externalSecrets.s3.enabled) }}
            - name: EXPORT_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ $s3SecretName }}
                  key: {{ .Values.s3ConfigFromSecret.bucketKey }}
                  optional: true
            - name: EXPORT_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: {{ $s3SecretName }}
                  key: {{ .Values.s3ConfigFromSecret.regionKey }}
                  optional: true
            - name: EXPORT_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ $s3SecretName }}
                  key: {{ .Values.s3ConfigFromSecret.endpointKey }}
                  optional: true
            {{- else }}
            - name: EXPORT_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: {{ include "audit-service.fullname" . }}-config
                  key: EXPORT_S3_BUCKET
            - name: EXPORT_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: {{ include "audit-service.fullname" . }}-config
                  key: EXPORT_S3_REGION
            - name: EXPORT_S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "audit-service.fullname" . }}-config
                  key: EXPORT_S3_ENDPOINT
            {{- end }}
            - name: EXPORT_S3_PUBLIC_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "audit-service.fullname" . }}-config
                  key: EXPORT_S3_PUBLIC_ENDPOINT
            - name: EXPORT_S3_PATH_STYLE_ACCESS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "audit-service.fullname" . }}-config
                  key: EXPORT_S3_PATH_STYLE_ACCESS
            - name: EXPORT_S3_KEY_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: {{ include "audit-service.fullname" . }}-config
                  key: EXPORT_S3_KEY_PREFIX
            - name: EXPORT_S3_PRESIGN_EXPIRY_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "audit-service.fullname" . }}-config
                  key: EXPORT_S3_PRESIGN_EXPIRY_SECONDS
            - name: EXPORT_S3_MAX_CONNECTIONS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "audit-service.fullname" . }}-config
                  key: EXPORT_S3_MAX_CONNECTIONS
            - name: EXPORT_S3_CONNECTION_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "audit-service.fullname" . }}-config
                  key: EXPORT_S3_CONNECTION_TIMEOUT_MS
            - name: EXPORT_S3_SOCKET_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "audit-service.fullname" . }}-config
                  key: EXPORT_S3_SOCKET_TIMEOUT_MS
            - name: EXPORT_S3_CONNECTION_ACQUISITION_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "audit-service.fullname" . }}-config
                  key: EXPORT_S3_CONNECTION_ACQUISITION_TIMEOUT_MS
            - name: EXPORT_S3_CONNECTION_MAX_IDLE_MS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "audit-service.fullname" . }}-config
                  key: EXPORT_S3_CONNECTION_MAX_IDLE_MS
            - name: EXPORT_S3_CONNECTION_TTL_MS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "audit-service.fullname" . }}-config
                  key: EXPORT_S3_CONNECTION_TTL_MS
            {{- if or .Values.s3Credentials.existingSecret .Values.externalSecrets.s3.enabled }}
            - name: EXPORT_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $s3SecretName }}
                  key: {{ .Values.s3Credentials.accessKeyKey }}
            - name: EXPORT_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $s3SecretName }}
                  key: {{ .Values.s3Credentials.secretKeyKey }}
            {{- end }}

            - name: CLICKHOUSE_NATIVE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "audit-service.fullname" . }}-clickhouse
                  key: native-url
            - name: CLICKHOUSE_HTTP_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "audit-service.fullname" . }}-clickhouse
                  key: http-url
            - name: CLICKHOUSE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "audit-service.fullname" . }}-clickhouse
                  key: username
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "audit-service.fullname" . }}-clickhouse
                  key: password
            - name: CLICKHOUSE_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "audit-service.fullname" . }}-config
                  key: CLICKHOUSE_DATABASE
            - name: KEYCLOAK_ISSUER_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "audit-service.fullname" . }}-keycloak
                  key: issuer-uri

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.exportStorage.enabled }}
            - name: exports
              mountPath: {{ .Values.exportStorage.mountPath }}
            {{- end }}

          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
