apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "audit-service.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "audit-service.labels" . | nindent 4 }}
data:
  SERVER_PORT: {{ .Values.env.SERVER_PORT | quote }}
  HEALTH_PORT: {{ .Values.env.HEALTH_PORT | quote }}
  RESTAUTH_BASE_URL: {{ .Values.env.RESTAUTH_BASE_URL | quote }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | quote }}
  EXPORT_STORAGE_TYPE: {{ .Values.env.EXPORT_STORAGE_TYPE | quote }}
  EXPORT_PVC_PATH: {{ .Values.env.EXPORT_PVC_PATH | quote }}
  EXPORT_S3_BUCKET: {{ .Values.env.EXPORT_S3_BUCKET | quote }}
  EXPORT_S3_REGION: {{ .Values.env.EXPORT_S3_REGION | quote }}
  EXPORT_S3_ENDPOINT: {{ .Values.env.EXPORT_S3_ENDPOINT | quote }}
  EXPORT_S3_PUBLIC_ENDPOINT: {{ .Values.env.EXPORT_S3_PUBLIC_ENDPOINT | quote }}
  EXPORT_S3_PATH_STYLE_ACCESS: {{ .Values.env.EXPORT_S3_PATH_STYLE_ACCESS | quote }}
  EXPORT_S3_KEY_PREFIX: {{ .Values.env.EXPORT_S3_KEY_PREFIX | quote }}
  EXPORT_S3_PRESIGN_EXPIRY_SECONDS: {{ .Values.env.EXPORT_S3_PRESIGN_EXPIRY_SECONDS | quote }}
  EXPORT_S3_MAX_CONNECTIONS: {{ .Values.env.EXPORT_S3_MAX_CONNECTIONS | quote }}
  EXPORT_S3_CONNECTION_TIMEOUT_MS: {{ .Values.env.EXPORT_S3_CONNECTION_TIMEOUT_MS | quote }}
  EXPORT_S3_SOCKET_TIMEOUT_MS: {{ .Values.env.EXPORT_S3_SOCKET_TIMEOUT_MS | quote }}
  EXPORT_S3_CONNECTION_ACQUISITION_TIMEOUT_MS: {{ .Values.env.EXPORT_S3_CONNECTION_ACQUISITION_TIMEOUT_MS | quote }}
  EXPORT_S3_CONNECTION_MAX_IDLE_MS: {{ .Values.env.EXPORT_S3_CONNECTION_MAX_IDLE_MS | quote }}
  EXPORT_S3_CONNECTION_TTL_MS: {{ .Values.env.EXPORT_S3_CONNECTION_TTL_MS | quote }}
  CLICKHOUSE_DATABASE: {{ .Values.env.CLICKHOUSE_DATABASE | quote }}
  CLICKHOUSE_POOL_SIZE: {{ .Values.env.CLICKHOUSE_POOL_SIZE | quote }}
  AUDIT_INCIDENTS_DETECTION_INTERVAL_SECONDS: {{ .Values.env.AUDIT_INCIDENTS_DETECTION_INTERVAL_SECONDS | quote }}
  AUDIT_INCIDENTS_BRUTE_FORCE_THRESHOLD: {{ .Values.env.AUDIT_INCIDENTS_BRUTE_FORCE_THRESHOLD | quote }}
  AUDIT_INCIDENTS_MASS_DELETE_THRESHOLD: {{ .Values.env.AUDIT_INCIDENTS_MASS_DELETE_THRESHOLD | quote }}
  AUDIT_INCIDENTS_VOLUME_ANOMALY_MULTIPLIER: {{ .Values.env.AUDIT_INCIDENTS_VOLUME_ANOMALY_MULTIPLIER | quote }}
  AUDIT_INCIDENTS_VOLUME_ANOMALY_MIN_THRESHOLD: {{ .Values.env.AUDIT_INCIDENTS_VOLUME_ANOMALY_MIN_THRESHOLD | quote }}
  AUDIT_INCIDENTS_TOPIC_ENUMERATION_THRESHOLD: {{ .Values.env.AUDIT_INCIDENTS_TOPIC_ENUMERATION_THRESHOLD | quote }}
  AUDIT_INCIDENTS_TOPIC_ENUMERATION_GRACE_SECONDS: {{ .Values.env.AUDIT_INCIDENTS_TOPIC_ENUMERATION_GRACE_SECONDS | quote }}
  AUDIT_INCIDENTS_OFF_HOURS_THRESHOLD: {{ .Values.env.AUDIT_INCIDENTS_OFF_HOURS_THRESHOLD | quote }}
