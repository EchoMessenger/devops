replicaCount: 1

image:
  repository: ghcr.io/echomessenger/audit
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/actuator/prometheus"
  prometheus.io/port: "8081"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080
  healthPort: 8081

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: audit.echo-messenger.ru
      paths:
        - path: /api/v1
          pathType: Prefix
  tls:
    - secretName: echo-tls
      hosts:
        - audit.echo-messenger.ru

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# PVC для хранения export файлов
exportStorage:
  enabled: true
  storageClassName: local-path
  size: 5Gi
  mountPath: /exports

env:
  SERVER_PORT: "8080"
  HEALTH_PORT: "8081"
  EXPORT_STORAGE_TYPE: "s3"
  EXPORT_PVC_PATH: "/exports"
  EXPORT_S3_BUCKET: "audit-exports"
  EXPORT_S3_REGION: "us-east-1"
  EXPORT_S3_ENDPOINT: ""
  EXPORT_S3_PUBLIC_ENDPOINT: "https://minio.echo-messenger.ru"
  EXPORT_S3_PATH_STYLE_ACCESS: "true"
  EXPORT_S3_KEY_PREFIX: "audit/exports"
  EXPORT_S3_PRESIGN_EXPIRY_SECONDS: "900"
  EXPORT_S3_MAX_CONNECTIONS: "50"
  EXPORT_S3_CONNECTION_TIMEOUT_MS: "3000"
  EXPORT_S3_SOCKET_TIMEOUT_MS: "5000"
  EXPORT_S3_CONNECTION_ACQUISITION_TIMEOUT_MS: "3000"
  EXPORT_S3_CONNECTION_MAX_IDLE_MS: "20000"
  EXPORT_S3_CONNECTION_TTL_MS: "60000"
  RESTAUTH_BASE_URL: "http://restauth.restauth.svc.cluster.local:8000"
  LOG_LEVEL: "debug"
  CLICKHOUSE_DATABASE: "audit"
  CLICKHOUSE_POOL_SIZE: "10"
  AUDIT_INCIDENTS_DETECTION_INTERVAL_SECONDS: "15"
  AUDIT_INCIDENTS_BRUTE_FORCE_THRESHOLD: "10"
  AUDIT_INCIDENTS_MASS_DELETE_THRESHOLD: "10"
  AUDIT_INCIDENTS_VOLUME_ANOMALY_MULTIPLIER: "10.0"
  AUDIT_INCIDENTS_VOLUME_ANOMALY_MIN_THRESHOLD: "50"
  AUDIT_INCIDENTS_TOPIC_ENUMERATION_THRESHOLD: "5"
  AUDIT_INCIDENTS_TOPIC_ENUMERATION_GRACE_SECONDS: "5"
  AUDIT_INCIDENTS_OFF_HOURS_THRESHOLD: "10"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "https://auth.echo-messenger.ru/realms/echo"

s3Credentials:
  # Если указан existingSecret, chart не создаёт свой secret для S3
  existingSecret: ""
  accessKeyKey: access-key
  secretKeyKey: secret-key

s3ConfigFromSecret:
  enabled: true
  endpointKey: endpoint
  regionKey: region
  bucketKey: bucket

# ExternalSecret ссылки (имена секретов в Vault/OpenBao)
externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-global
    kind: ClusterSecretStore
  clickhouse:
    remoteRef:
      key: clickhouse/audit
      # Ожидаемые поля в Vault: url, user, password
  keycloak:
    remoteRef:
      key: platform/keycloak
      # Ожидаемые поля в Vault: issuer-uri
  s3:
    enabled: true
    remoteRef:
      key: audit/s3
      # Ожидаемые поля в Vault: accessKey, secretKey, endpoint, region, bucket

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8081
  initialDelaySeconds: 30
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8081
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
