apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ingestor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ingestor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Kafka consumer group сам управляет балансировкой партиций между репликами.
  # RollingUpdate гарантирует что старый pod дочитает свои партиции
  # до того как новый начнёт их принимать.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "ingestor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ingestor.selectorLabels" . | nindent 8 }}
      annotations:
        # Prometheus scraping
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # Рестарт при изменении ConfigMap
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}

      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      # Graceful shutdown: даём 30 секунд на дочитывание сообщений и flush батчей.
      # Должно быть больше чем BATCH_TIMEOUT + время дочитывания последнего батча.
      terminationGracePeriodSeconds: 30

      containers:
        - name: ingestor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

          ports:
            - name: http
              containerPort: 8081
              protocol: TCP

          # Все несекретные переменные из ConfigMap
          envFrom:
            - configMapRef:
                name: {{ include "ingestor.fullname" . }}

          # Секреты монтируем отдельно — не попадают в describe pod
          env:
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ingestor.fullname" . }}-kafka-user
                  key: password
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "ingestor.fullname" . }}-clickhouse
                  key: username
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ingestor.fullname" . }}-clickhouse
                  key: password

          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}

          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}