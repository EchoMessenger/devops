---
# Секрет для Kafka SASL — пароль пользователя ingestor
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "ingestor.fullname" . }}-kafka-user
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ingestor.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.openbao.resyncInterval }}
  secretStoreRef:
    name: openbao-global
    kind: ClusterSecretStore
  target:
    name: {{ include "ingestor.fullname" . }}-kafka-user
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.openbao.secretsPath }}/{{ .Values.kafka.sasl.username }}
        property: password

---
# Секрет для ClickHouse — username и password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "ingestor.fullname" . }}-clickhouse
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ingestor.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.openbao.resyncInterval }}
  secretStoreRef:
    name: openbao-global
    kind: ClusterSecretStore
  target:
    name: {{ include "ingestor.fullname" . }}-clickhouse
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: secret/clickhouse/credentials
        property: username
    - secretKey: password
      remoteRef:
        key: secret/clickhouse/credentials
        property: password

---
# Секрет для пулла образа из ghcr
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ingestor.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-global
    kind: ClusterSecretStore
  target:
    name: ghcr-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "username": "{{ "{{" }} .username {{ "}}" }}",
                "password": "{{ "{{" }} .token {{ "}}" }}",
                "auth": "{{ "{{" }} printf "%s:%s" .username .token | b64enc {{ "}}" }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: registry/ghcr
        property: username
    - secretKey: token
      remoteRef:
        key: registry/ghcr
        property: token