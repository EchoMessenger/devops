---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webapp
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: webapp
  policyTypes: [Ingress, Egress]
  ingress:
    # От Traefik
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 8080
    # Healthcheck от kubelet
    - from:
        - ipBlock:
            cidr: 10.42.0.0/16  # Pod CIDR - для kube-probe
      ports:
        - port: 8080
  egress:
    # К Tinode API
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tinode
      ports:
        - port: 6060
        - port: 16060
    # К BFF API для same-origin /bff прокси в nginx
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bff
      ports:
        - port: 7000
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
