replicaCount: 1

image:
  repository: ghcr.io/echomessenger/webapp
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

tinodeServer:
  # Backend upstream for nginx /v0 proxy.
  # Leave empty to use tinode.<namespace>.svc.cluster.local.
  host: ""
  # Tinode runs in a separate namespace from webapp.
  namespace: tinode
  port: 6060
  # Browser-side Tinode host is resolved from the webapp origin.

keycloak:
  url: "https://auth.echo-messenger.ru"
  realm: "echo"
  clientId: "webapp"
  scope: "openid profile email"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  host: www.echo-messenger.ru
  tlsSecretName: tinode-webapp-tls

certManager:
  issuerName: letsencrypt-prod

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

openbao:
  clusterSecretStore: openbao-global
  secrets:
    keygen:
      path: tinode/keygen
    ghcr:
      path: registry/ghcr
