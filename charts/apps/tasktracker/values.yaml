image:
  repository: "ghcr.io/echomessenger/tasktracker"
  tag: "latest"
  pullPolicy: "Always"

imagePullSecrets:
  - name: ghcr-secret

replicaCount: 1

service:
  port: 8000
  type: ClusterIP

database:
  host: tasktracker-postgres
  port: 5432
  name: tasktracker
  username: "postgres"
  sslmode: "disable"

keycloak:
  issuerUri: "https://auth.echo-messenger.ru/realms/echo"
#  realm: "echo"
  clientId: "auth"


log:
  level: "debug"

healthChecks:
  liveness:
    path: "/health"
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    path: "/health"
    initialDelaySeconds: 5
    periodSeconds: 5

openbao:
  clusterSecretStore: openbao-global
  enabled: true
  path: "secret"
  role: "tasktracker"
  serviceAccount: "tasktracker-sa"
  secretsPath: "kafka"
  databaseSecretsPath: "tasktracker/postgres"
  registrySecretsPath: "registry/ghcr"
  keycloakSecretsPath: "tasktracker/keycloak"
  resyncInterval: "10s"

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

volumes:
  docs:
    enabled: true
  logs:
    enabled: true
    size: "1Gi"