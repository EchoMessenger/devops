apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tasktracker.fullname" . }}
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tasktracker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tasktracker.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.openbao.enabled }}
      imagePullSecrets:
        - name: ghcr-secret
      {{- end }}

      initContainers:
#        - name: wait-for-db
#          image: busybox:1.36
#          command:
#            - sh
#            - -c
#            - |
#              until nc -z {{ .Values.database.host }} {{ .Values.database.port }}; do
#                echo "Waiting for PostgreSQL..."
#                sleep 2
#              done
        - name: sync-db-password
          image: postgres:16
          env:
            - name: NEW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: { { include "tasktracker.fullname" . } }-database
                  key: password
          command:
            - sh
            - -c
            - |
              set -e

              echo "Waiting for PostgreSQL..."

              until pg_isready -h {{ .Values.database.host }} \
                               -p {{ .Values.database.port }} \
                               -U {{ .Values.database.username }}; do
                sleep 2
              done

              echo "Altering password using trust authentication..."

              psql -h {{ .Values.database.host }} \
                   -p {{ .Values.database.port }} \
                   -U {{ .Values.database.username }} \
                   -d {{ .Values.database.name }} \
                   -c "ALTER USER {{ .Values.database.username }} WITH PASSWORD '$NEW_PASSWORD';"

              echo "Password synchronized successfully."

      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.service.port }}
              name: http

          envFrom:
            - configMapRef:
                name: {{ include "tasktracker.fullname" . }}

          env:
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.database.username }}:$(DATABASE_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode={{ .Values.database.sslmode }}"

            # Database password (from ExternalSecret)
            {{- if .Values.openbao.enabled }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tasktracker.fullname" . }}-database
                  key: password
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "tasktracker.fullname" . }}-keycloak
                  key: clientSecret
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.healthChecks.liveness.path | default "/health" }}
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.healthChecks.liveness.initialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.healthChecks.liveness.periodSeconds | default 10 }}
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: {{ .Values.healthChecks.readiness.path | default "/health" }}
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.healthChecks.readiness.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.healthChecks.readiness.periodSeconds | default 5 }}
            timeoutSeconds: 3
            failureThreshold: 3

          # Resources
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          # Volume mounts
          volumeMounts:
            {{- if .Values.volumes.docs.enabled }}
            - name: docs
              mountPath: /app/docs
            {{- end }}
            {{- if .Values.volumes.logs.enabled }}
            - name: logs
              mountPath: /app/logs
            {{- end }}

      # Volumes
      volumes:
        {{- if .Values.volumes.docs.enabled }}
        - name: docs
          emptyDir: {}
        {{- end }}
        {{- if .Values.volumes.logs.enabled }}
        - name: logs
          emptyDir:
            sizeLimit: {{ .Values.volumes.logs.size }}
        {{- end }}