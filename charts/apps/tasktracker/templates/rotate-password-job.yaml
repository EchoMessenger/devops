apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tasktracker.fullname" . }}-rotate-db-password
  labels:
    app.kubernetes.io/name: {{ include "tasktracker.name" . }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: rotate-password
          image: postgres:16
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tasktracker.fullname" . }}-database
                  key: password
          command:
            - sh
            - -c
            - |
              echo "Rotating postgres password..."
              psql -h {{ .Values.database.host }} \
                   -U {{ .Values.database.username }} \
                   -d {{ .Values.database.name }} \
                   -c "ALTER USER {{ .Values.database.username }} WITH PASSWORD '$PGPASSWORD';"
              echo "Password rotation completed"