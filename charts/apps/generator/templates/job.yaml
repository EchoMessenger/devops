{{- if .Values.job.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "generator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "generator.labels" . | nindent 4 }}
  {{- if .Values.job.hook.enabled }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": {{ .Values.job.hook.weight | quote }}
    "helm.sh/hook-delete-policy": {{ .Values.job.hook.deletePolicy | quote }}
  {{- end }}
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "generator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "generator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      restartPolicy: {{ .Values.restartPolicy }}

      volumes:
        - name: config
          configMap:
            name: {{ include "generator.fullname" . }}-config
            defaultMode: 0444
        {{- if .Values.volumes.tmpDir.enabled }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.volumes.tmpDir.sizeLimit }}
        {{- end }}

      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP

          env:
            - name: LOG_LEVEL
              value: {{ .Values.env.LOG_LEVEL | quote }}
            - name: METRICS_ADDR
              value: {{ .Values.env.METRICS_ADDR | quote }}
            - name: EVENTS_LOG_FILE
              value: {{ .Values.env.EVENTS_LOG_FILE | quote }}
            {{- if .Values.externalSecrets.enabled }}
            - name: TINODE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "generator.fullname" . }}-tinode
                  key: api-key
            {{- end }}

          volumeMounts:
            - name: config
              mountPath: /etc/generator
              readOnly: true
            {{- if .Values.volumes.tmpDir.enabled }}
            - name: tmp
              mountPath: /tmp
            {{- end }}

          args:
            - "-config"
            - "/etc/generator/generator-config.yaml"
            - "-log-level"
            - "{{ .Values.env.LOG_LEVEL }}"
            - "-metrics"
            - "{{ .Values.env.METRICS_ADDR }}"
            - "-events-log"
            - "{{ .Values.env.EVENTS_LOG_FILE }}"
            {{- if .Values.generator.settings.selectedScenarios }}
            - "-scenarios"
            - "{{ .Values.generator.settings.selectedScenarios }}"
            {{- end }}
            {{- if .Values.generator.settings.dryRun }}
            - "-dry-run"
            {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 10
          {{- end }}

          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
