# Default values for generator
image:
  repository: ghcr.io/echomessenger/generator
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

# Job configuration
job:
  # Enable/disable the generator job
  enabled: true
  
  # Helm hook configuration for running after app deployment
  hook:
    enabled: true
    weight: 50
    deletePolicy: before-hook-creation,hook-succeeded

  # Job backoff limit (retries)
  backoffLimit: 2

  # Time limit for job completion (seconds)
  ttlSecondsAfterFinished: 3600

# CronJob configuration (optional, for scheduled runs)
cronjob:
  enabled: false
  schedule: "0 22 * * *"  # 22:00 UTC (off-hours scenario)
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"
  prometheus.io/port: "8080"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Generator configuration
generator:
  # Server configuration
  server:
    # Tinode WebSocket endpoint (matches tinode_new chart service ports)
    url: "wss://tinode.tinode.svc.cluster.local:16060/v0/channels"
    # REST API endpoint for user provisioning (HTTP, not HTTPS - Tinode serves HTTP)
    apiEndpoint: "http://tinode.tinode.svc.cluster.local:6060"
    # Connection timeout in seconds
    timeoutSeconds: 30

  # Generator settings
  settings:
    # Max concurrent goroutines
    maxConcurrency: 10
    # Rate limit (events per second, 0 = unlimited)
    rateLimitPerSecond: 100
    # Dry run: log events but don't send to server
    dryRun: false
    # Log level: debug, info, warn, error
    logLevel: debug
    # Selected scenarios: "all" or comma-separated (e.g., "brute_force,volume_anomaly")
    selectedScenarios: "all"

  # Test users to be provisioned
  users:
    - id: attacker
      login: attacker_user
      password: "GeneratorAttacker123!@#"
      description: "Attacker account for security testing"
    - id: victim
      login: victim_user
      password: "GeneratorVictim456!@#"
      description: "Victim account for testing"
    - id: normal_user1
      login: normal_user_1
      password: "GeneratorNormal001!@#"
      description: "Normal user for baseline traffic"

  # Test topics to be created
  topics:
    - name: "test_group"
      type: "group"
      description: "Test group topic for scenarios"
      defaultAccessAuth: "JRWPS"
      defaultAccessAnon: "N"

  # Scenario configurations
  scenarios:
    # R1: Brute Force Login Attempts
    brute_force:
      enabled: true
      description: "Multiple failed logins to trigger brute force detection"
      userId: attacker
      targetLogin: victim_user
      minAttempts: 10
      intervalMs: 500
      timeoutSeconds: 60

    # R2: Concurrent Sessions
    concurrent_sessions:
      enabled: true
      description: "Multiple simultaneous connections from same user"
      userId: attacker
      sessionCount: 4
      connectionIntervalMs: 100

    # R3: Mass Delete
    mass_delete:
      enabled: true
      description: "Rapid message deletions to trigger mass delete detection"
      userId: attacker
      topic: "p2p-attacker-victim"
      deleteBurstCount: 12
      deleteIntervalMs: 100

    # R4: Volume Anomaly
    volume_anomaly:
      enabled: true
      description: "Unusually high publishing rate"
      userId: attacker
      messagesPerMinute: 200
      durationSeconds: 120

    # R5: Enumeration
    enumeration:
      enabled: true
      description: "Subscription attempts to restricted topics"
      userId: attacker
      topicIds:
        - "grpAAA"
        - "grpBBB"
        - "grpCCC"
      subscriptionIntervalMs: 200

    # R6: Inactive Account Activity
    inactive_account:
      enabled: false
      description: "Activity from dormant account (requires manual setup)"
      userId: inactive
      messageBurstCount: 50

    # R7: Off-Hours Activity
    off_hours:
      enabled: false
      description: "Traffic outside business hours"
      userId: attacker
      messagesPerMinute: 50
      businessHoursStart: "09:00"
      businessHoursEnd: "18:00"
      durationSeconds: 300

    # Baseline: Normal Traffic
    normal:
      enabled: true
      description: "Normal p2p and group messaging"
      users:
        - victim
        - normal_user1
      durationSeconds: 300
      messagesPerMinute: 5

# Environment variables (non-sensitive)
env:
  LOG_LEVEL: "debug"
  METRICS_ADDR: ":8080"
  EVENTS_LOG_FILE: "/tmp/events.jsonl"

# Resource constraints
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# External Secrets for retrieving Tinode API key from OpenBao
externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-global
    kind: ClusterSecretStore

  # Tinode API key from keygen
  tinode:
    remoteRef:
      # Path in OpenBao: secret/tinode/keygen
      key: tinode/keygen

  # GitHub Container Registry credentials
  registry:
    remoteRef:
      # Path in OpenBao: secret/registry/ghcr
      key: registry/ghcr

# Service for metrics endpoint
service:
  enabled: true
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}

# Volumes for logs and events (optional)
volumes:
  tmpDir:
    enabled: true
    sizeLimit: 1Gi

# Pod restart policy
restartPolicy: Never

# Node affinity (optional)
affinity: {}

# Node selector (optional)
nodeSelector: {}

# Tolerations (optional)
tolerations: []

# Probes
livenessProbe:
  enabled: false

readinessProbe:
  enabled: false
