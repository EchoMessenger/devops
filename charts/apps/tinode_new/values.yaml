# Образ Tinode
image:
  repository: ghcr.io/echomessenger/tinode-server
  tag: latest-amd64
  pullPolicy: Always

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]

automountServiceAccountToken: false

# OpenBao интеграция через External Secrets Operator
openbao:
  enabled: true
  clusterSecretStore: openbao-global
  # Пути к секретам в OpenBao
  secrets:
    registry:
      path: registry/ghcr
    postgres:
      path: tinode/postgres
    keygen:
      path: tinode/keygen

# Количество реплик
replicaCount: 1

# Тип сервиса и порты
service:
  type: ClusterIP
  http:
    port: 6060
    targetPort: 6060
  grpc:
    port: 16060
    targetPort: 16060

# Ingress для доступа извне
ingress:
  # Для локальной разработки: добавьте в /etc/hosts запись на IP ingress-контроллера
  # (например, 127.0.0.1 tinode.echo-messenger.ru) и укажите этот хост в webapp.
  enabled: true
  # Должен совпадать с ingress-контроллером в кластере (в нашем webapp используется traefik).
  className: "traefik"
  annotations:
    # WebSocket поддержка для Traefik: keep connection alive для долгоживущих WebSocket соединений
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
  hosts:
    - host: tinode.echo-messenger.ru
      paths:
        - path: /
          pathType: Prefix
  tls: []

# База данных
database:
  # Тип БД: mysql, postgres, mongodb, rethinkdb
  type: postgres
  
  # Настройки для ожидания готовности БД
  waitFor:
    enabled: true
    host: postgres
    port: 5432
  
  # DSN подключения
  # При использовании OpenBao DSN не нужен - он будет построен автоматически из секретов
  postgres:
    dsn: ""
  
  # Опции инициализации
  reset: false
  upgrade: false
  noInit: false
  sampleData: "data.json"

# Ключи шифрования (ОБЯЗАТЕЛЬНО замените на свои!)
# При использовании OpenBao эти ключи не используются
encryption:
  apiKeySalt: ""
  authTokenKey: ""
  uidEncryptionKey: ""

# Конфигурация хранилища медиа
media:
  handler: "s3"  # fs или s3
  maxSize: 33554432  # 32MB
  
  # Настройки файловой системы
  fs:
    corsOrigins: '["*"]'
  
  # Настройки S3
  # При использовании OpenBao, значения будут заполнены через ExternalSecret
  s3:
    accessKeyId: ""  # заполняется из OpenBao: tinode/s3 -> accessKey
    secretAccessKey: ""  # заполняется из OpenBao: tinode/s3 -> secretKey
    region: "us-east-1"  # совпадает с OpenBao: region
    bucket: "tinode-minio"  # совпадает с OpenBao: bucket
    endpoint: ""  # заполняется из OpenBao: tinode/s3 -> endpoint
    corsOrigins: '["*"]'

# Email верификация
email:
  verification:
    required: false
    debugCode: ""
  smtp:
    hostUrl: "http://localhost:6060"
    server: ""
    port: ""
    sender: ""
    login: ""
    password: ""
    authMechanism: ""
    heloHost: ""
    domains: ""  # JSON массив доменов, например '["example.com"]'

# SMS верификация
tel:
  hostUrl: ""
  sender: ""
  debugCode: ""

# Push уведомления через FCM
fcm:
  enabled: false
  projectId: ""
  credFile: ""
  apiKey: ""
  appId: ""
  senderId: ""
  vapidKey: ""
  measurementId: ""
  includeAndroidNotification: true

# Push через Tinode Push Gateway
tnpg:
  enabled: false
  authToken: ""
  org: ""

# TLS/SSL
tls:
  enabled: false
  domainName: ""
  contactAddress: ""

# WebRTC
webrtc:
  enabled: false
  iceServersFile: ""

# Garbage collection для незавершенных регистраций
accountGc:
  enabled: false

# Дефолтный код страны
defaultCountryCode: "RU"

# REST authentication (Tinode auth_config.rest)
auth:
  rest:
    serverUrl: "http://restauth.restauth.svc.cluster.local:8000/"

# Путь для статуса сервера
serverStatusPath: ""

# Кластеризация
cluster:
  enabled: false
  selfName: ""
  nodes:
    - name: "tinode-0"
      addr: "tinode-0:12000"
    - name: "tinode-1"
      addr: "tinode-1:12001"
    - name: "tinode-2"
      addr: "tinode-2:12002"

plugins:
  router:
    enabled: true
    name: "router"
    timeout: 20000
    serviceAddr: "grpc://router-router.router.svc.cluster.local:7911"
    failureCode: 0
    failureText: "ERR | router | Router has failed. Continuing..."
    filters:
      fireHose: "pub,sub,leave,hi,acc,login,get,set,del,note,data,meta,pres,info"
      account: "CRUD"
      message: "CRUD"
      subscription: "CRUD"
      topic: "CRUD"

# Ресурсы подов
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Health checks
livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: 6060
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: 6060
  initialDelaySeconds: 10
  periodSeconds: 5

# PersistentVolume для uploads (если используется fs handler)
persistence:
  enabled: true
  storageClass: ""  # Оставить пустым для дефолтного StorageClass
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /opt/tinode/uploads

# NodeSelector, tolerations, affinity
nodeSelector: {}
tolerations: []
affinity: {}

# ServiceAccount
serviceAccount:
  create: false
  annotations: {}
  name: ""

# Дополнительные переменные окружения
extraEnv: []
  # - name: CUSTOM_VAR
  #   value: "custom_value"

# ConfigMap и Secret для дополнительных настроек
extraEnvFrom: []
  # - configMapRef:
  #     name: tinode-extra-config
  # - secretRef:
  #     name: tinode-extra-secrets