# Default values for Node.js Event Generator
# This is a YAML-formatted file containing the default values for the generator Helm chart.

# Image configuration
image:
  repository: ghcr.io/echomessenger/generator-js
  pullPolicy: Always
  tag: "1.0.0"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: "event-generator"

# Job configuration for running scenarios
job:
  # Enable/disable the generator job
  enabled: true

  # Helm hook configuration for running after app deployment
  hook:
    enabled: true
    weight: 50
    deletePolicy: before-hook-creation,hook-succeeded

  # Job backoff limit (retries)
  backoffLimit: 2

  # Time limit for job completion (seconds)
  ttlSecondsAfterFinished: 3600

# CronJob configuration (optional, for scheduled runs)
cronjob:
  enabled: false
  schedule: "0 22 * * *"  # 22:00 UTC (off-hours scenario)
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"
  prometheus.io/port: "8080"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Generator configuration (maps to .env file)
generator:
  # Server configuration
  server:
    # Tinode WebSocket endpoint
    host: "tinode.tinode.svc.cluster.local"
    port: 16060
    secure: false
    apiKey: "AQEAAAAABAA="

    # Connection timeout in seconds
    timeoutSeconds: 30

    # Keycloak configuration for JWT authentication
    keycloak:
      enabled: true
      url: "https://keycloak.example.com"
      realm: "echo"
      clientId: "tinode-js"

  # Generator settings
  settings:
    # Rate limit (milliseconds between operations)
    rateLimitMs: 100

    # Max concurrent connections
    maxConcurrent: 10

    # Dry run: test connection without executing scenarios
    dryRun: false

    # Log level: debug, info, warn, error
    logLevel: info

  # Test users - MUST match Keycloak users or pre-existing Tinode accounts
  # Example: alice123, bob123, carol123, dave123, eve123, frank123, tino123, xena123
  users:
    - id: attacker
      login: alice
      password: "alice123"
      description: "Attacker account (brute force, anomalies)"

    - id: victim
      login: bob
      password: "bob123"
      description: "Victim account (target for attacks)"

    - id: normal_user
      login: carol
      password: "carol123"
      description: "Normal user for baseline traffic"

    - id: inactive_user
      login: dormant
      password: "dormant123"
      description: "Inactive account (requires manual setup, 30+ days)"

  # Test topics to enumerate
  topics:
    - "grpAdminPanel"
    - "grpFinancialReports"
    - "grpSecurityTeam"
    - "grpExecutiveChat"
    - "grpHRRecords"

  # Scenario configurations (R1-R7)
  scenarios:
    # R1: Brute Force Login Attempts
    r1_bruteforce:
      enabled: true
      description: "Multiple failed logins to trigger brute force detection"
      targetLogin: alice
      attempts: 15
      rateLimitMs: 100

    # R2: Concurrent Sessions
    r2_concurrent:
      enabled: true
      description: "Multiple simultaneous connections from same user"
      user: alice
      sessionCount: 4
      publishPerSession: 3
      rateLimitMs: 100

    # R3: Mass Delete
    r3_massdel:
      enabled: true
      description: "Rapid message deletions to trigger mass delete detection"
      user: alice
      deleteCount: 12
      deleteIntervalMs: 100

    # R4: Volume Anomaly
    r4_volumeanomaly:
      enabled: true
      description: "Unusually high publishing rate"
      user: alice
      messagesPerMinute: 200
      durationSeconds: 120

    # R5: Topic Enumeration
    r5_enumeration:
      enabled: true
      description: "Subscription attempts to restricted topics"
      user: alice
      enumerationIntervalMs: 200

    # R6: Inactive Account Activity
    r6_inactive:
      enabled: false
      description: "Activity from dormant account (requires manual setup)"
      user: dormant
      messageBurstCount: 50

    # R7: Off-Hours Activity
    r7_offhours:
      enabled: false
      description: "Traffic outside business hours"
      user: alice
      messagesPerMinute: 50
      normalHoursStart: "09:00"
      normalHoursEnd: "17:00"
      durationSeconds: 300

    # Normal: Baseline Traffic
    normal:
      enabled: true
      description: "Normal messaging patterns for comparison"
      users:
        - bob
        - carol
      messageCount: 5
      rateLimitMs: 500

# Environment variables (non-sensitive)
env:
  LOG_LEVEL: "info"
  LOG_FILE: "/var/log/generator/generator.log"
  EVENTS_FILE: "/var/data/generator/events.jsonl"

# Environment variables from secrets
envFrom:
  - secretRef:
      name: generator-secrets
      optional: true

# Resource constraints
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# External Secrets for retrieving sensitive credentials from OpenBao
externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-global
    kind: ClusterSecretStore

  # Tinode API key from keygen
  tinode:
    remoteRef:
      key: tinode/keygen
    target:
      name: generator-secrets
      creationPolicy: Owner
      template:
        engineVersion: v2
        data:
          TINODE_API_KEY: "{{ .api_key }}"

  # Keycloak credentials
  keycloak:
    remoteRef:
      key: keycloak/generator
    target:
      name: generator-secrets
      creationPolicy: Owner
      template:
        engineVersion: v2
        data:
          KEYCLOAK_URL: "{{ .url }}"
          KEYCLOAK_REALM: "{{ .realm }}"

  # GitHub Container Registry credentials
  registry:
    remoteRef:
      key: registry/ghcr
    target:
      name: ghcr-secret
      creationPolicy: Owner
      template:
        engineVersion: v2
        data:
          .dockerconfigjson: |
            {
              "auths": {
                "ghcr.io": {
                  "username": "{{ .username }}",
                  "password": "{{ .token }}"
                }
              }
            }

# Service for logs/metrics endpoint (optional)
service:
  enabled: true
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}

# Volumes for logs and events
volumes:
  logs:
    enabled: true
    size: 500Mi
    path: /var/log/generator
  data:
    enabled: true
    size: 1Gi
    path: /var/data/generator

# Pod restart policy (Job pods don't restart)
restartPolicy: Never

# Node affinity (optional - e.g., run on specific node pool)
affinity: {}

# Node selector (optional)
nodeSelector: {}

# Tolerations (optional)
tolerations: []

# Probes (typically disabled for Job-type workloads)
livenessProbe:
  enabled: false

readinessProbe:
  enabled: false

# Command-line arguments for the generator
args:
  # Scenarios to run: comma-separated or "all"
  scenarios: "all"
  # Log level override
  logLevel: "info"
  # Dry-run mode
  dryRun: false

# Node.js runtime configuration
nodejs:
  # Node.js version (for base image tag)
  version: "18-alpine"
  # Environment for Node.js
  environment: production
  # Heap size limits
  maxOldSpaceSize: 256

# Labels for pod
labels:
  app: generator
  version: "1.0.0"
  component: event-generator
  managed-by: helm

# Annotations for pod
annotations:
  description: "Event generator for audit service incident detection testing"
