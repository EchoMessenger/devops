# Production Environment values
# For production Kubernetes cluster with security hardening

image:
  repository: ghcr.io/echomessenger/generator-js
  tag: "1.0.0"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

job:
  enabled: false  # Use cronjob for production

cronjob:
  enabled: true
  schedule: "0 22 * * *"  # Daily at 22:00 UTC
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 2

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 750m
    memory: 1Gi

generator:
  server:
    host: "tinode.tinode.svc.cluster.local"
    port: 16060
    secure: false
    timeoutSeconds: 30
    keycloak:
      enabled: true
      url: "https://keycloak.echo-messenger.ru"
      realm: "echo"
      clientId: "tinode-js"

  settings:
    rateLimitMs: 100
    maxConcurrent: 20
    logLevel: info
    dryRun: false

  scenarios:
    r1_bruteforce:
      enabled: true
      attempts: 15
    r2_concurrent:
      enabled: true
      sessionCount: 4
    r3_massdel:
      enabled: true
      deleteCount: 12
    r4_volumeanomaly:
      enabled: true
      messagesPerMinute: 200
      durationSeconds: 120
    r5_enumeration:
      enabled: true
    r6_inactive:
      enabled: false  # Requires pre-staging
    r7_offhours:
      enabled: false  # Optional
    normal:
      enabled: true

externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-global
    kind: ClusterSecretStore

env:
  LOG_LEVEL: "info"
  LOG_FILE: "/var/log/generator/generator.log"
  EVENTS_FILE: "/var/data/generator/events.jsonl"

volumes:
  logs:
    enabled: true
    size: 1Gi
  data:
    enabled: true
    size: 2Gi

nodeSelector:
  workload-type: audit

tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "audit"
    effect: "NoSchedule"

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-type
              operator: In
              values:
                - compute

args:
  scenarios: "all"
  logLevel: "info"
  dryRun: false

labels:
  environment: production
  team: security
  service: audit

annotations:
  description: "Production event generator for audit incident detection testing"
  maintained-by: platform-team
