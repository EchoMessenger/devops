{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "bff.fullname" . }}-ratelimit
  labels:
    {{- include "bff.labels" . | nindent 4 }}
spec:
  rateLimit:
    average: {{ .Values.env.RATE_LIMIT_PER_MINUTE }}
    burst: {{ mul (atoi .Values.env.RATE_LIMIT_PER_MINUTE) 2 }}
    period: 1m
{{- end }}
