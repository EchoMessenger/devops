{{- if .Values.externalSecrets.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "bff.fullname" . }}-keycloak
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bff.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "bff.fullname" . }}-keycloak
    creationPolicy: Owner
  data:
    - secretKey: issuer-uri
      remoteRef:
        key: {{ .Values.externalSecrets.keycloak.remoteRef.key }}
        property: issuer-uri

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "bff.fullname" . }}-services
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bff.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "bff.fullname" . }}-services
    creationPolicy: Owner
  data:
    - secretKey: audit-url
      remoteRef:
        key: {{ .Values.externalSecrets.services.remoteRef.key }}
        property: audit-url
    - secretKey: tasktracker-url
      remoteRef:
        key: {{ .Values.externalSecrets.services.remoteRef.key }}
        property: tasktracker-url

---
# Secret for pulling images from GHCR
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bff.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: ghcr-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "username": "{{ "{{" }} .username {{ "}}" }}",
                "password": "{{ "{{" }} .token {{ "}}" }}",
                "auth": "{{ "{{" }} printf "%s:%s" .username .token | b64enc {{ "}}" }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.externalSecrets.registry.remoteRef.key }}
        property: username
    - secretKey: token
      remoteRef:
        key: {{ .Values.externalSecrets.registry.remoteRef.key }}
        property: token
{{- end }}
