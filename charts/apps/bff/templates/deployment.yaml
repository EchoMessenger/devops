apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bff.fullname" . }}
  labels:
    {{- include "bff.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "bff.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "bff.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "bff.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: bff
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        env:
        # From ConfigMap (non-sensitive)
        - name: BFF_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "bff.fullname" . }}
              key: BFF_PORT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: {{ include "bff.fullname" . }}
              key: LOG_LEVEL
        - name: RATE_LIMIT_PER_MINUTE
          valueFrom:
            configMapKeyRef:
              name: {{ include "bff.fullname" . }}
              key: RATE_LIMIT_PER_MINUTE
        # From ExternalSecrets (sensitive data from OpenBao/Vault)
        {{- if .Values.externalSecrets.enabled }}
        - name: KEYCLOAK_ISSUER_URI
          valueFrom:
            secretKeyRef:
              name: {{ include "bff.fullname" . }}-keycloak
              key: issuer-uri
        - name: AUDIT_SERVICE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "bff.fullname" . }}-services
              key: audit-url
        - name: TASKTRACKER_SERVICE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "bff.fullname" . }}-services
              key: tasktracker-url
        {{- else }}
        # Fallback: load from ConfigMap if ExternalSecrets disabled (dev mode)
        - name: KEYCLOAK_ISSUER_URI
          valueFrom:
            configMapKeyRef:
              name: {{ include "bff.fullname" . }}-fallback
              key: KEYCLOAK_ISSUER_URI
        - name: AUDIT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "bff.fullname" . }}-fallback
              key: AUDIT_SERVICE_URL
        - name: TASKTRACKER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "bff.fullname" . }}-fallback
              key: TASKTRACKER_SERVICE_URL
        {{- end }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 12 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 12 }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        {{- with .Values.volumeMounts }}
        volumeMounts:
          {{- toYaml . | nindent 12 }}
        {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
