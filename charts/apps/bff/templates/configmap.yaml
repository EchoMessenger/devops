apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bff.fullname" . }}
  labels:
    {{- include "bff.labels" . | nindent 4 }}
data:
  BFF_PORT: {{ .Values.env.BFF_PORT | quote }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | quote }}
  RATE_LIMIT_PER_MINUTE: {{ .Values.env.RATE_LIMIT_PER_MINUTE | quote }}
  AUDIT_SERVICE_URL: {{ .Values.env.AUDIT_SERVICE_URL | quote }}
  TASKTRACKER_SERVICE_URL: {{ .Values.env.TASKTRACKER_SERVICE_URL | quote }}
---
{{- if not .Values.externalSecrets.enabled }}
# Fallback ConfigMap when ExternalSecrets is disabled (for dev/testing only)
# In development mode, Keycloak issuer URI is provided directly
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bff.fullname" . }}-fallback
  labels:
    {{- include "bff.labels" . | nindent 4 }}
data:
  KEYCLOAK_ISSUER_URI: {{ .Values.fallbackKeycloakIssuerUri | quote }}
{{- end }}
