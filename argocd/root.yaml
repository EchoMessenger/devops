apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/EchoMessenger/devops.git
    targetRevision: HEAD
    path: argocd
    directory:
      recurse: true
      include: "{platform/*.yaml,infra/*.yaml,apps/*.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true