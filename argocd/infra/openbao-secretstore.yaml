apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao-secretstore
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  source:
    repoURL: https://github.com/EchoMessenger/devops.git
    path: charts/infra/openbao-secretstore
    targetRevision: HEAD
    helm:
      releaseName: openbao-secretstore
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [ CreateNamespace=true ]