---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-addons
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/EchoMessenger/devops.git
    targetRevision: HEAD
    path: charts/infra/monitoring
    directory:
      recurse: false
      include: "{postgres-exporter.yaml,cert-manager-monitor.yaml,traefik-monitor.yaml,custom-alerts.yaml,kafka-metrics.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
