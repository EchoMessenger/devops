apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-crd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://helm.traefik.io/traefik
    chart: traefik-crd
    targetRevision: 34.2.1
    helm:
      releaseName: traefik-crd
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
---
