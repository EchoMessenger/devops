apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: argocd
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: argocd-redirect-to-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - argocd.echo-messenger.ru
      secretName: argocd-tls
  rules:
    - host: argocd.echo-messenger.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              # Argo CD server must run with server.insecure=true for TLS termination here.
              service:
                name: argocd-server
                port:
                  number: 80
